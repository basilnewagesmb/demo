<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Websites</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f7f7f6;
    color: #1a1a1a;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  .grid {
    max-width: 1840px;
    margin: 0 auto;
    padding: clamp(24px, 3vw, 52px) clamp(16px, 2.8vw, 52px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px 20px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .grid { grid-template-columns: 1fr; gap: 36px; } }

  .shot {
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: #ececea;
  }
  .shot img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .shot img { transform: scale(1.04); }
  .name { margin-top: 16px; font-size: clamp(17px, 1.3vw, 21px); font-weight: 500; }
</style>
</head>
<body>

<main class="grid" id="grid"></main>

<script>
  // One entry per site, newest first. file = path in sites/, shot = path in snapshots/.
  const SITES = [
    { name: "v4", file: "sites/v4-nasdrive-pro-website.html", shot: "snapshots/v4.png" },
    { name: "v3", file: "sites/v3-nasdrive-pro-website.html", shot: "snapshots/v3.png" },
    { name: "v2", file: "sites/v2-nasdrive-pro-website.html", shot: "snapshots/v2.png" },
    { name: "v1", file: "sites/v1-nasdrive-pro.html",         shot: "snapshots/v1.png" },
  ];

  document.getElementById("grid").innerHTML = SITES.map(s => `
    <a class="card" href="${s.file}" target="_blank" rel="noopener">
      <div class="shot"><img src="${s.shot}" alt="${s.name}" loading="lazy"></div>
      <div class="name">${s.name}</div>
    </a>`).join("");
</script>
</body>
</html>
